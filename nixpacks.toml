providers = ["php"]

[phases.setup]
nixPkgs = [
  "php83",
  "php83Extensions.pdo_mysql",
  "php83Extensions.gd",
  "php83Extensions.mbstring",
  "php83Extensions.intl",
  "php83Extensions.zip",
  "php83Extensions.xml"
]

[phases.install]
cmds = ["cd app && composer install --no-dev --optimize-autoloader --no-scripts"]

[phases.build]
cmds = [
  "cd app && mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/app/private storage/app/public && touch storage/logs/laravel.log",
  "cd app && php artisan config:cache",
  "cd app && php artisan route:cache",
  "cd app && php artisan view:cache"
]

[start]
cmd = "cd /app/app && php artisan storage:link --force && php artisan serve --host 0.0.0.0 --port $PORT"
